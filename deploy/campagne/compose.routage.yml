# Essai du routage par champ DICOM (docs/routage-dicom.md) et de la réception STOW-RS (docs/stow-rs.md) : sur la
# destination IU_AUTO de la box A, le partenaire est choisi par les règles ; Orthanc A déclare les deux destinations
# DICOM (IU_TO_B, routage fixe, et IU_AUTO) et le serveur DICOMweb de la box A (dépôt STOW-RS sur IU_AUTO).
#
#   docker compose -f docker-compose.yml -f campagne/compose.campagne.yml -f campagne/compose.routage.yml up -d

services:
  box-a:
    environment:
      IMAGUNITY_DICOM_ROUTING_AET: IU_AUTO
      # 1. Scanners du CHU → box B.
      IMAGUNITY_DICOM_RULES_0_NAME: scanner-chu
      IMAGUNITY_DICOM_RULES_0_WHEN_MODALITY: CT
      IMAGUNITY_DICOM_RULES_0_WHEN_INSTITUTIONNAME: "CHU*"
      IMAGUNITY_DICOM_RULES_0_TO_0: box-b
      # 2. IRM → box B et box C (une étude, deux transferts ; box C n'existe pas dans cet environnement).
      IMAGUNITY_DICOM_RULES_1_NAME: irm-deux-sites
      IMAGUNITY_DICOM_RULES_1_WHEN_MODALITY: MR
      IMAGUNITY_DICOM_RULES_1_TO_0: box-b
      IMAGUNITY_DICOM_RULES_1_TO_1: box-c
      # Compte DICOMweb du PACS : mot de passe d'essai de cet environnement de test seulement.
      IMAGUNITY_DICOMWEB_PASSWORD: essai-synthetique
  orthanc-a:
    environment:
      ORTHANC__DICOM_MODALITIES: |
        { "imagunity-b": ["IU_TO_B", "net-a", 11112], "imagunity-auto": ["IU_AUTO", "net-a", 11112] }
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_WEB__SERVERS: |
        { "imagunity-auto": ["http://172.31.1.10:8080/dicomweb/IU_AUTO", "pacs", "essai-synthetique"] }
