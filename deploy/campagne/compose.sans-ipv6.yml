# Uniquement sur un hôte sans IPv6 (noyau sans support IPv6, cas de certains bacs à sable) :
# les relais SimpleX écoutent par défaut sur « :: » et s'arrêtent. Le module force-ipv4.so
# (construit par prepare.sh depuis ipv4/force-ipv4.c) restreint leur écoute à IPv4.
#
#   docker compose -f docker-compose.yml -f campagne/compose.campagne.yml -f campagne/compose.sans-ipv6.yml up -d

services:
  smp-server:
    environment:
      LD_PRELOAD: /opt/force-ipv4.so
    volumes:
      - ./campagne/build/force-ipv4.so:/opt/force-ipv4.so:ro
  xftp-server:
    environment:
      LD_PRELOAD: /opt/force-ipv4.so
    volumes:
      - ./campagne/build/force-ipv4.so:/opt/force-ipv4.so:ro
  chat-a:
    environment:
      LD_PRELOAD: /opt/force-ipv4.so
    volumes:
      - ./campagne/build/force-ipv4.so:/opt/force-ipv4.so:ro
  chat-b:
    environment:
      LD_PRELOAD: /opt/force-ipv4.so
    volumes:
      - ./campagne/build/force-ipv4.so:/opt/force-ipv4.so:ro
