# Complément à installer si les clés de la box sont protégées par le TPM (IMAGUNITY_DIRECTORY_IDENTITY_TPM=true) :
#   install -D -m 0644 imagunity-box-tpm.conf /etc/systemd/system/imagunity-box.service.d/tpm.conf
[Service]
SupplementaryGroups=tss
DeviceAllow=/dev/tpmrm0 rw
Environment=TPM2TOOLS_TCTI=device:/dev/tpmrm0
