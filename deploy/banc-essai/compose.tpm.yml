# Clés des box protégées par le TPM de l'hôte (docs/reference/cles-tpm.md) : un secret tiré par la box, scellé dans le TPM,
# chiffre ses fichiers de clés ; copiés ailleurs, ils sont inutilisables. À ajouter après compose.annuaire.yml :
# au premier démarrage, la phrase de passe (secret Docker) sert une dernière fois, puis ne sert plus.
#
#   IMAGUNITY_DIRECTORY_IDENTITY_TPM_PCRS : registres PCR auxquels lier le secret (par exemple sha256:0,7 :
#                                           micrologiciel et démarrage sécurisé) ; vide : aucun
#
#   docker compose -f docker-compose.yml -f compose.annuaire.yml -f compose.tpm.yml --profile annuaire up -d

x-tpm: &tpm
  IMAGUNITY_DIRECTORY_IDENTITY_TPM: "true"
  IMAGUNITY_DIRECTORY_IDENTITY_TPM_PCRS: ${IMAGUNITY_DIRECTORY_IDENTITY_TPM_PCRS:-}
  TPM2TOOLS_TCTI: device:/dev/tpmrm0

services:
  box-a:
    environment: *tpm
    devices:
      - /dev/tpmrm0
  box-b:
    environment: *tpm
    devices:
      - /dev/tpmrm0
