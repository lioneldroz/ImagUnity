# Campagne de tests : images construites à partir des jars préparés par prepare.sh (sans réseau), et
# regroupement plus rapide des études (5 s sans nouvelle instance).
services:
  directory:
    image: imagunity/directory:campagne
    build:
      context: ./campagne/build
      dockerfile: directory.Dockerfile
  relay:
    image: imagunity/relay:campagne
    build:
      context: ./campagne/build
      dockerfile: relay.Dockerfile
  box-a:
    image: imagunity/box:campagne
    environment:
      IMAGUNITY_DICOM_STUDYIDLETIMEOUT: 5s
    build:
      context: ./campagne/build
      dockerfile: box.Dockerfile
  box-b:
    image: imagunity/box:campagne
    environment:
      IMAGUNITY_DICOM_STUDYIDLETIMEOUT: 5s
    build:
      context: ./campagne/build
      dockerfile: box.Dockerfile
