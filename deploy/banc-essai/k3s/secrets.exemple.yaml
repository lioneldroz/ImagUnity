# Exemple de secrets du relais : valeurs à remplacer, fichier à ne jamais versionner avec de vraies valeurs.
#   kubectl -n imagunity-relais create secret generic relais-base --from-literal=password=...
#   kubectl -n imagunity-relais create secret generic relais-s3 --from-literal=access-key=... --from-literal=secret-key=...
apiVersion: v1
kind: Secret
metadata:
  name: relais-base
  namespace: imagunity-relais
stringData:
  password: essai-synthetique
---
apiVersion: v1
kind: Secret
metadata:
  name: relais-s3
  namespace: imagunity-relais
stringData:
  access-key: relais-essai
  secret-key: secret-synthetique-de-test
