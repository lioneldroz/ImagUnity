# Relais IU-T réparti sur K3s (spécification § 6.8) : plusieurs instances sans état derrière Traefik, base PostgreSQL
# et stockage S3 partagés.
#
#   kubectl apply -k deploy/banc-essai/k3s
#
# Avant : créer les secrets (voir secrets.exemple.yaml) et le ConfigMap de la clé publique du responsable :
#   kubectl -n imagunity-relais create configmap relais-organisation --from-file=organisation.pub.json
# Base PostgreSQL et stockage S3 fournis à part (production : base répliquée, CloudNativePG par exemple, et S3
# redondant). Pour un essai avec PostgreSQL et SeaweedFS à une instance : kubectl apply -k deploy/banc-essai/k3s/essai
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: imagunity-relais
resources:
  - namespace.yaml
  - relais.yaml
  - traefik-config.yaml
images:
  - name: imagunity/relay
    newTag: campagne
