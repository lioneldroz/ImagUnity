# Environnement de la preuve de concept ImagUnity.
#
# Trois réseaux séparés simulent les deux établissements et Internet :
#   site-a  : orthanc-a + box A (chat-a / box-a)
#   site-b  : orthanc-b + box B (chat-b / box-b)
#   relais  : smp-server, xftp-server, et les clients simplex-chat des deux box
# Aucun chemin réseau direct n'existe entre site-a et site-b : tout passe par les relais.
#
# Chaque box est composée de deux conteneurs qui partagent la même pile réseau (celle de net-x,
# network_mode: service:net-x) et le même volume /data : le client simplex-chat, processus
# séparé (AGPL), et le logiciel ImagUnity qui le pilote par WebSocket sur localhost.

name: imagunity

services:

  # --- Relais aveugles -------------------------------------------------------

  smp-server:
    image: simplexchat/smp-server:v7.0.1
    environment:
      # Adresse IPv4 fixe : l'image refuse un nom court (« smp-server ») et, avec un nom de domaine,
      # exige un certificat HTTPS pour son site statique. Les clients joignent le relais par son nom
      # de service et l'authentifient par l'empreinte de son certificat.
      ADDR: 172.30.0.10
      WEB_MANUAL: "1"   # pas de site web statique (il exigerait un certificat HTTPS) : port SMP 5223 seul
    volumes:
      - smp-config:/etc/opt/simplex
      - smp-logs:/var/opt/simplex
    networks:
      relais:
        ipv4_address: 172.30.0.10

  xftp-server:
    image: simplexchat/xftp-server:v7.0.1
    environment:
      ADDR: 172.30.0.11
      QUOTA: 20gb
      PASS: ""        # pas de mot de passe de création de fichiers (variable obligatoire pour l'image)
    volumes:
      - xftp-config:/etc/opt/simplex-xftp
      - xftp-logs:/var/opt/simplex-xftp
      - xftp-files:/srv/xftp
    networks:
      relais:
        ipv4_address: 172.30.0.11

  # --- Annuaire de l'organisation (profil « annuaire ») ----------------------
  # Publie les entrées de box signées par le responsable. Clé publique de l'organisation attendue dans
  # ./annuaire/organisation.pub.json (voir docs/annuaire-signe.md).

  directory-db:
    image: postgres:17
    profiles: [annuaire]
    environment:
      POSTGRES_DB: annuaire
      POSTGRES_USER: annuaire
      POSTGRES_PASSWORD: essai-synthetique   # environnement de test uniquement
    volumes:
      - directory-db-data:/var/lib/postgresql/data
    networks: [relais]

  directory:
    build:
      context: ../backend
      dockerfile: ../deploy/directory/Dockerfile
    profiles: [annuaire]
    environment:
      IMAGUNITY_DIRECTORY_DB_URL: jdbc:postgresql://directory-db:5432/annuaire
      IMAGUNITY_DIRECTORY_DB_PASSWORD: essai-synthetique
      IMAGUNITY_DIRECTORY_ORGANIZATION_KEY: /config/organisation.pub.json
      # Compte de dépôt du responsable : environnement de test uniquement.
      IMAGUNITY_DIRECTORY_PUBLISHER_PASSWORD: essai-synthetique
    volumes:
      - ./annuaire/organisation.pub.json:/config/organisation.pub.json:ro
    depends_on: [directory-db]
    networks: [relais]
    ports:
      - "8090:8090"

  # --- Box A (émettrice) -----------------------------------------------------

  # Pile réseau de la box A, partagée par chat-a et box-a comme dans un pod : le client SimpleX et la
  # box peuvent redémarrer chacun de leur côté sans perdre le réseau de l'autre.
  net-a:
    image: ubuntu:24.04
    command: ["sleep", "infinity"]
    init: true
    networks:
      relais:
      site-a:
        ipv4_address: 172.31.1.10
        gw_priority: 1   # réseau du site prioritaire : la console publiée y arrive
    ports:
      - "8081:8080"   # console de la box A

  chat-a:
    build: ./simplex-chat
    environment:
      BOX_NAME: box-a
    volumes:
      # Volume partagé avec box-a : le client lit les paquets à envoyer et écrit les paquets reçus
      # aux chemins que lui donne la box (/data/outbox, /data/inbox). Chacun a ses propres sous-dossiers.
      - box-a-data:/data
      - smp-config:/smp-config:ro
      - xftp-config:/xftp-config:ro
    network_mode: service:net-a
    depends_on: [smp-server, xftp-server, net-a]

  box-a:
    build:
      context: ../backend
      dockerfile: ../deploy/box/Dockerfile
    environment:
      IMAGUNITY_BOX_NAME: box-a
      IMAGUNITY_DATA_DIR: /data
      # Console et entrée DICOM sur le réseau du site seulement : rien n'écoute côté relais (« Internet »).
      SERVER_ADDRESS: 172.31.1.10
      # Compte opérateur de la console : mot de passe d'essai de cet environnement de test, à ne jamais
      # reprendre ailleurs (en production : IMAGUNITY_CONSOLE_PASSWORD propre à chaque box, idéalement haché).
      IMAGUNITY_CONSOLE_PASSWORD: essai-synthetique
      IMAGUNITY_DICOM_BIND_ADDRESS: 172.31.1.10
      # Entrée DICOM : seul Orthanc A peut pousser ; la destination IU_TO_B désigne la box B.
      IMAGUNITY_DICOM_ALLOWED_CALLING_AETS: ORTHANC_A
      IMAGUNITY_DICOM_ROUTES_0_CALLED_AET: IU_TO_B
      IMAGUNITY_DICOM_ROUTES_0_DESTINATION: box-b
      # Restitution des études reçues au PACS du site A.
      IMAGUNITY_PACS_HOST: orthanc-a
      IMAGUNITY_PACS_PORT: "4242"
      IMAGUNITY_PACS_AET: ORTHANC_A
      IMAGUNITY_BOX_AET: IMAGUNITY_A
    volumes:
      - box-a-data:/data
    network_mode: service:net-a
    depends_on: [chat-a]

  orthanc-a:
    image: orthancteam/orthanc:26.11.0
    environment:
      ORTHANC__NAME: orthanc-a
      ORTHANC__DICOM_AET: ORTHANC_A
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      # Envoyer vers IU_TO_B = désigner la box B comme destinataire (routage par AET).
      ORTHANC__DICOM_MODALITIES: |
        { "imagunity-b": ["IU_TO_B", "net-a", 11112] }
    volumes:
      - orthanc-a-data:/var/lib/orthanc/db
    networks: [site-a]
    ports:
      - "8042:8042"

  # --- Box B (réceptrice) ----------------------------------------------------

  # Pile réseau de la box B, partagée par chat-b et box-b comme dans un pod : le client SimpleX et la
  # box peuvent redémarrer chacun de leur côté sans perdre le réseau de l'autre.
  net-b:
    image: ubuntu:24.04
    command: ["sleep", "infinity"]
    init: true
    networks:
      relais:
      site-b:
        ipv4_address: 172.31.2.10
        gw_priority: 1   # réseau du site prioritaire : la console publiée y arrive
    ports:
      - "8082:8080"   # console de la box B

  chat-b:
    build: ./simplex-chat
    environment:
      BOX_NAME: box-b
    volumes:
      # Volume partagé avec box-b : le client lit les paquets à envoyer et écrit les paquets reçus
      # aux chemins que lui donne la box (/data/outbox, /data/inbox). Chacun a ses propres sous-dossiers.
      - box-b-data:/data
      - smp-config:/smp-config:ro
      - xftp-config:/xftp-config:ro
    network_mode: service:net-b
    depends_on: [smp-server, xftp-server, net-b]

  box-b:
    build:
      context: ../backend
      dockerfile: ../deploy/box/Dockerfile
    environment:
      IMAGUNITY_BOX_NAME: box-b
      IMAGUNITY_DATA_DIR: /data
      # Console et entrée DICOM sur le réseau du site seulement : rien n'écoute côté relais (« Internet »).
      SERVER_ADDRESS: 172.31.2.10
      # Compte opérateur de la console : mot de passe d'essai de cet environnement de test, à ne jamais
      # reprendre ailleurs (en production : IMAGUNITY_CONSOLE_PASSWORD propre à chaque box, idéalement haché).
      IMAGUNITY_CONSOLE_PASSWORD: essai-synthetique
      IMAGUNITY_DICOM_BIND_ADDRESS: 172.31.2.10
      # Sens retour (symétrique) : Orthanc B pousse vers IU_TO_A pour désigner la box A.
      IMAGUNITY_DICOM_ALLOWED_CALLING_AETS: ORTHANC_B
      IMAGUNITY_DICOM_ROUTES_0_CALLED_AET: IU_TO_A
      IMAGUNITY_DICOM_ROUTES_0_DESTINATION: box-a
      # Restitution des études reçues au PACS du site B.
      IMAGUNITY_PACS_HOST: orthanc-b
      IMAGUNITY_PACS_PORT: "4242"
      IMAGUNITY_PACS_AET: ORTHANC_B
      IMAGUNITY_BOX_AET: IMAGUNITY_B
    volumes:
      - box-b-data:/data
    network_mode: service:net-b
    depends_on: [chat-b]

  orthanc-b:
    image: orthancteam/orthanc:26.11.0
    environment:
      ORTHANC__NAME: orthanc-b
      ORTHANC__DICOM_AET: ORTHANC_B
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      # Envoyer vers IU_TO_A = désigner la box A (sens retour).
      ORTHANC__DICOM_MODALITIES: |
        { "imagunity-a": ["IU_TO_A", "net-b", 11112] }
    volumes:
      - orthanc-b-data:/var/lib/orthanc/db
    networks: [site-b]
    ports:
      - "8043:8042"

networks:
  relais:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  site-a:
    ipam:
      config:
        - subnet: 172.31.1.0/24
  site-b:
    ipam:
      config:
        - subnet: 172.31.2.0/24

volumes:
  directory-db-data:
  smp-config:
  smp-logs:
  xftp-config:
  xftp-logs:
  xftp-files:
  box-a-data:
  box-b-data:
  orthanc-a-data:
  orthanc-b-data:
