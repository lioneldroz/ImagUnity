# Environnement de la preuve de concept ImagUnity, sur le transport IU-T (docs/specification-protocole.md).
#
# Trois réseaux séparés simulent les deux établissements et Internet :
#   site-a  : orthanc-a + box A
#   site-b  : orthanc-b + box B
#   relais  : relais IU-T et annuaire de l'organisation, joints par les box en connexions sortantes
# Aucun chemin réseau direct n'existe entre site-a et site-b : tout passe par le relais.
#
# Avant le premier démarrage (voir deploy/README.md) :
#   - clé publique du responsable dans ./annuaire/organisation.pub.json, et son empreinte, vérifiée hors bande :
#       export IMAGUNITY_DIRECTORY_ORGANIZATION_CODE=XXXX-XXXX-XXXX-XXXX-XXXX-XXXX
#   - phrase de passe de chaque box (secret Docker, hors du volume de données, non versionné) :
#       head -c 24 /dev/urandom | base64 > annuaire/phrase-box-a.txt   (de même pour box-b)
# Chaque box crée son identité et réserve l'adresse de sa file au premier démarrage ; le responsable l'enrôle
# à partir de sa demande (console, onglet Annuaire), puis l'appairage se fait depuis la console.

name: imagunity

x-annuaire: &annuaire
  IMAGUNITY_DIRECTORY_ENABLED: "true"
  IMAGUNITY_DIRECTORY_URL: http://directory:8090
  IMAGUNITY_DIRECTORY_ORGANIZATION_KEY: /config/organisation.pub.json
  IMAGUNITY_DIRECTORY_ORGANIZATION_CODE: ${IMAGUNITY_DIRECTORY_ORGANIZATION_CODE:?empreinte du responsable à vérifier hors bande}
  IMAGUNITY_DIRECTORY_SYNC_INTERVAL: ${IMAGUNITY_DIRECTORY_SYNC_INTERVAL:-1m}
  # Transport IU-T : relais de l'organisation (HTTP dans ce labo ; derrière un proxy TLS en production).
  IMAGUNITY_IU_RELAY: http://relay:8443

secrets:
  phrase-box-a:
    file: ./annuaire/phrase-box-a.txt
  phrase-box-b:
    file: ./annuaire/phrase-box-b.txt

services:

  # --- Relais aveugle IU-T ---------------------------------------------------
  # Morceaux chiffrés (IU-FILE) et files de messages chiffrés (IU-MSG). Il n'accepte les dépôts que des box
  # enrôlées et actives de l'annuaire, qu'il lit avec la clé épinglée du responsable.

  relay-db:
    image: postgres:17
    environment:
      POSTGRES_DB: relais
      POSTGRES_USER: relais
      POSTGRES_PASSWORD: essai-synthetique   # environnement de test uniquement
    volumes:
      - relay-db-data:/var/lib/postgresql/data
    networks: [relais]

  relay:
    build:
      context: ../backend
      dockerfile: ../deploy/relay/Dockerfile
    environment:
      IMAGUNITY_RELAY_DB_URL: jdbc:postgresql://relay-db:5432/relais
      IMAGUNITY_RELAY_DB_PASSWORD: essai-synthetique
      IMAGUNITY_RELAY_STORAGE_DIR: /data/morceaux
      IMAGUNITY_RELAY_DIRECTORY_URL: http://directory:8090
      IMAGUNITY_RELAY_ORGANIZATION_KEY: /config/organisation.pub.json
      IMAGUNITY_RELAY_ORGANIZATION_CODE: ${IMAGUNITY_DIRECTORY_ORGANIZATION_CODE:?empreinte du responsable, vérifiée hors bande}
      IMAGUNITY_RELAY_DIRECTORY_SYNC_INTERVAL: ${IMAGUNITY_RELAY_DIRECTORY_SYNC_INTERVAL:-5m}
    volumes:
      - relay-data:/data
      - ./annuaire/organisation.pub.json:/config/organisation.pub.json:ro
    depends_on: [relay-db, directory]
    networks: [relais]
    ports:
      - "8443:8443"

  # --- Annuaire de l'organisation --------------------------------------------
  # Publie les entrées de box signées par le responsable (docs/annuaire-signe.md).

  directory-db:
    image: postgres:17
    environment:
      POSTGRES_DB: annuaire
      POSTGRES_USER: annuaire
      POSTGRES_PASSWORD: essai-synthetique   # environnement de test uniquement
    volumes:
      - directory-db-data:/var/lib/postgresql/data
    networks: [relais]

  directory:
    build:
      context: ../backend
      dockerfile: ../deploy/directory/Dockerfile
    environment:
      IMAGUNITY_DIRECTORY_DB_URL: jdbc:postgresql://directory-db:5432/annuaire
      IMAGUNITY_DIRECTORY_DB_PASSWORD: essai-synthetique
      IMAGUNITY_DIRECTORY_ORGANIZATION_KEY: /config/organisation.pub.json
      # Compte de dépôt du responsable : environnement de test uniquement.
      IMAGUNITY_DIRECTORY_PUBLISHER_PASSWORD: essai-synthetique
    volumes:
      - ./annuaire/organisation.pub.json:/config/organisation.pub.json:ro
    depends_on: [directory-db]
    networks: [relais]
    ports:
      - "8090:8090"

  # --- Box A (émettrice) -----------------------------------------------------

  # Pile réseau de la box A, comme dans un pod : la box (et son TPM logiciel dans les essais) peut redémarrer
  # sans perdre le réseau.
  net-a:
    image: ubuntu:24.04
    command: ["sleep", "infinity"]
    init: true
    networks:
      relais:
      site-a:
        ipv4_address: 172.31.1.10
        gw_priority: 1   # réseau du site prioritaire : la console publiée y arrive
    ports:
      - "8081:8080"   # console de la box A

  box-a:
    build:
      context: ../backend
      dockerfile: ../deploy/box/Dockerfile
    environment:
      <<: *annuaire
      IMAGUNITY_DIRECTORY_IDENTITY_PASSPHRASE_FILE: /run/secrets/phrase-box-a
      IMAGUNITY_BOX_NAME: box-a
      IMAGUNITY_DATA_DIR: /data
      # Console et entrée DICOM sur le réseau du site seulement : rien n'écoute côté relais (« Internet »).
      SERVER_ADDRESS: 172.31.1.10
      # Compte opérateur de la console : mot de passe d'essai de cet environnement de test, à ne jamais
      # reprendre ailleurs (en production : IMAGUNITY_CONSOLE_PASSWORD propre à chaque box, idéalement haché).
      IMAGUNITY_CONSOLE_PASSWORD: essai-synthetique
      IMAGUNITY_DICOM_BIND_ADDRESS: 172.31.1.10
      # Entrée DICOM : seul Orthanc A peut pousser ; la destination IU_TO_B désigne la box B.
      IMAGUNITY_DICOM_ALLOWED_CALLING_AETS: ORTHANC_A
      IMAGUNITY_DICOM_ROUTES_0_CALLED_AET: IU_TO_B
      IMAGUNITY_DICOM_ROUTES_0_DESTINATION: box-b
      # Restitution des études reçues au PACS du site A.
      IMAGUNITY_PACS_HOST: orthanc-a
      IMAGUNITY_PACS_PORT: "4242"
      IMAGUNITY_PACS_AET: ORTHANC_A
      IMAGUNITY_BOX_AET: IMAGUNITY_A
    secrets: [phrase-box-a]
    volumes:
      - box-a-data:/data
      - ./annuaire/organisation.pub.json:/config/organisation.pub.json:ro
    network_mode: service:net-a
    depends_on: [net-a, relay, directory]

  orthanc-a:
    image: orthancteam/orthanc:26.11.0
    environment:
      ORTHANC__NAME: orthanc-a
      ORTHANC__DICOM_AET: ORTHANC_A
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      # Envoyer vers IU_TO_B = désigner la box B comme destinataire (routage par AET).
      ORTHANC__DICOM_MODALITIES: |
        { "imagunity-b": ["IU_TO_B", "net-a", 11112] }
    volumes:
      - orthanc-a-data:/var/lib/orthanc/db
    networks: [site-a]
    ports:
      - "8042:8042"

  # --- Box B (réceptrice) ----------------------------------------------------

  net-b:
    image: ubuntu:24.04
    command: ["sleep", "infinity"]
    init: true
    networks:
      relais:
      site-b:
        ipv4_address: 172.31.2.10
        gw_priority: 1   # réseau du site prioritaire : la console publiée y arrive
    ports:
      - "8082:8080"   # console de la box B

  box-b:
    build:
      context: ../backend
      dockerfile: ../deploy/box/Dockerfile
    environment:
      <<: *annuaire
      IMAGUNITY_DIRECTORY_IDENTITY_PASSPHRASE_FILE: /run/secrets/phrase-box-b
      IMAGUNITY_BOX_NAME: box-b
      IMAGUNITY_DATA_DIR: /data
      SERVER_ADDRESS: 172.31.2.10
      IMAGUNITY_CONSOLE_PASSWORD: essai-synthetique
      IMAGUNITY_DICOM_BIND_ADDRESS: 172.31.2.10
      # Sens retour (symétrique) : Orthanc B pousse vers IU_TO_A pour désigner la box A.
      IMAGUNITY_DICOM_ALLOWED_CALLING_AETS: ORTHANC_B
      IMAGUNITY_DICOM_ROUTES_0_CALLED_AET: IU_TO_A
      IMAGUNITY_DICOM_ROUTES_0_DESTINATION: box-a
      # Restitution des études reçues au PACS du site B.
      IMAGUNITY_PACS_HOST: orthanc-b
      IMAGUNITY_PACS_PORT: "4242"
      IMAGUNITY_PACS_AET: ORTHANC_B
      IMAGUNITY_BOX_AET: IMAGUNITY_B
    secrets: [phrase-box-b]
    volumes:
      - box-b-data:/data
      - ./annuaire/organisation.pub.json:/config/organisation.pub.json:ro
    network_mode: service:net-b
    depends_on: [net-b, relay, directory]

  orthanc-b:
    image: orthancteam/orthanc:26.11.0
    environment:
      ORTHANC__NAME: orthanc-b
      ORTHANC__DICOM_AET: ORTHANC_B
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      # Envoyer vers IU_TO_A = désigner la box A (sens retour).
      ORTHANC__DICOM_MODALITIES: |
        { "imagunity-a": ["IU_TO_A", "net-b", 11112] }
    volumes:
      - orthanc-b-data:/var/lib/orthanc/db
    networks: [site-b]
    ports:
      - "8043:8042"

networks:
  relais:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  site-a:
    ipam:
      config:
        - subnet: 172.31.1.0/24
  site-b:
    ipam:
      config:
        - subnet: 172.31.2.0/24

volumes:
  relay-db-data:
  relay-data:
  directory-db-data:
  box-a-data:
  box-b-data:
  orthanc-a-data:
  orthanc-b-data:
