name: CI    # Nom affiché dans l'onglet "Actions" de GitHub

on:
  push:
    branches: [main]    # Lance le workflow à chaque push sur main
  pull_request:         # ...et sur toute pull request (quelle que soit la branche cible)
  workflow_dispatch:    # ...et à la main, sur n'importe quelle branche (onglet Actions)

# Le GITHUB_TOKEN n'a que les droits de lecture sur le dépôt
permissions:
  contents: read

# Annule les runs obsolètes d'une même branche / PR quand un nouveau commit arrive
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25)
    runs-on: ubuntu-latest  # Machine virtuelle Linux fournie par GitHub
    defaults:
      run:
        working-directory: backend  # Toutes les commandes `run` s'exécutent dans ./backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  — Récupère le code du dépôt sur la machine
        with:
          persist-credentials: false   # le jeton GitHub ne reste pas dans le dépôt cloné
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0  — Installe le JDK
        with:
          distribution: temurin     # JDK Eclipse Temurin (build OpenJDK)
          java-version: '25'
          cache: maven               # Met en cache ~/.m2 pour accélérer les builds suivants
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0  — La console React est construite et embarquée dans le jar de la box
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sh ./mvnw -B -ntp verify
        # mvnw  : Maven Wrapper (utilise la version de Maven définie dans le projet)
        # sh    : évite les problèmes si le fichier n'a pas le bit exécutable
        # -B    : mode batch (logs propres, sans couleurs ni interactivité)
        # -ntp  : no-transfer-progress (n'affiche pas les barres de téléchargement)
        # verify: compile, lance les tests unitaires ET d'intégration, vérifie le package

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest  # Machine virtuelle Linux fournie par GitHub
    defaults:
      run:
        working-directory: frontend # Commandes exécutées dans ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  — Récupère le code du dépôt sur la machine
        with:
          persist-credentials: false   # le jeton GitHub ne reste pas dans le dépôt cloné
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm                # Cache des dépendances npm
          cache-dependency-path: frontend/package-lock.json
          # Nécessaire car le lockfile n'est pas à la racine du dépôt
      - run: npm ci         # Installation propre et reproductible (strictement d'après package-lock.json
      - run: npm run lint   # Analyse statique (ESLint, en général)
      - run: npm run build  # Vérifie que l'application compile pour la production

  accessibilite:
    name: Accessibilité (RGAA 4.1.2)
    # Critères vérifiables automatiquement (axe-core, étiquette RGAAv4) et mesures maison : contrastes des champs,
    # messages de statut, 320 px, espacement du texte, focus, lien d'évitement. Ne remplace pas un audit manuel.
    # Interfaces couvertes : administration de l'annuaire (/admin/), interface du responsable et console de la box,
    # API simulée. Voir accessibilite/README.md.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accessibilite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # le jeton GitHub ne reste pas dans le dépôt cloné
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            accessibilite/package-lock.json
            frontend/package-lock.json
      - name: Construction de la console de la box (testée telle qu'elle est livrée)
        working-directory: frontend
        run: npm ci && npm run build
      - run: npm ci
      - run: npx playwright install --with-deps chromium   # Navigateur de la version de Playwright du lockfile
      - run: npm test       # Validation HTML (html-validate) puis contrôles Playwright (thème clair ; système sombre vérifié)
        env:
          CI: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2  — Rapport détaillé (résultats axe-core joints à chaque test)
        if: ${{ !cancelled() }}
        with:
          name: rapport-accessibilite
          path: accessibilite/playwright-report
          retention-days: 14

  licences:
    name: Licences des composants
    runs-on: ubuntu-latest
    # ImagUnity est propriétaire : chaque composant livré doit avoir une licence permissive ou à copyleft faible
    # (deploy/licences/politique.json, docs/reference/licences.md), et NOTICE.md doit lister les composants livrés.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # le jeton GitHub ne reste pas dans le dépôt cloné
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Nomenclature du backend (CycloneDX)
        working-directory: backend
        run: >
          sh ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
          -DoutputFormat=json -DoutputName=sbom.cdx
      - name: Contrôle des licences et de NOTICE.md
        run: >
          python3 deploy/licences/verifier-licences.py
          --sbom backend/target/sbom.cdx.json
          --npm frontend/package-lock.json
          --npm-outil accessibilite/package-lock.json
          --pip-outil deploy/banc-essai/campagne/requirements.txt
          --verifier-notice NOTICE.md
      - name: NOTICE.md régénéré (en cas d'écart, par exemple sur une pull request de Dependabot)
        if: failure()
        run: >
          python3 deploy/licences/verifier-licences.py
          --sbom backend/target/sbom.cdx.json
          --npm frontend/package-lock.json
          --npm-outil accessibilite/package-lock.json
          --pip-outil deploy/banc-essai/campagne/requirements.txt
          --notice NOTICE.md || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: notice
          path: NOTICE.md
          retention-days: 14

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    # Cherche des secrets (clés, jetons, mots de passe) dans tout l'historique du dépôt. Exceptions : faux positifs
    # vérifiés seulement (.gitleaks.toml). Un vrai secret trouvé se révoque et se remplace (SECURITY.md).
    env:
      GITLEAKS_VERSION: 8.30.1
      # Empreinte publiée avec la version (gitleaks_<version>_checksums.txt) : l'archive téléchargée est vérifiée.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0               # tout l'historique : un secret retiré depuis reste dans les anciens commits
          persist-credentials: false   # le jeton GitHub ne reste pas dans le dépôt cloné
      - name: Installation de gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Recherche de secrets dans l'historique
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

  workflows:
    name: Workflows GitHub (zizmor)
    runs-on: ubuntu-latest
    # Audit de sécurité des workflows et de la configuration Dependabot : actions épinglées par empreinte, jeton
    # non conservé, injections dans les scripts, caches dans la livraison, droits du jeton…
    env:
      ZIZMOR_VERSION: 1.32.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # le jeton GitHub ne reste pas dans le dépôt cloné
      - run: pipx install "zizmor==${ZIZMOR_VERSION}"
      - name: Audit des workflows
        run: zizmor --offline --format=github .github

  images:
    name: Images du site central (relais, annuaire)
    runs-on: ubuntu-latest
    # Construit les images comme la livraison : la construction échoue si le Java de l'image est vulnérable
    # (CVE-2026-114938, contrôle dans les Dockerfile).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # le jeton GitHub ne reste pas dans le dépôt cloné
      - run: docker build -q -t imagunity/relay:ci -f deploy/relay/Dockerfile backend
      - run: docker build -q -t imagunity/directory:ci -f deploy/directory/Dockerfile backend
      - name: Java des images
        run: |
          for i in relay directory; do
            docker run --rm --entrypoint java "imagunity/$i:ci" -version 2>&1 | head -n 1
          done

  compose:
    name: Docker Compose (validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # le jeton GitHub ne reste pas dans le dépôt cloné
      - run: docker compose -f deploy/banc-essai/docker-compose.yml config --quiet
        env:
          # Empreinte du responsable : exigée par le Compose (vérifiée hors bande en vrai), factice ici.
          IMAGUNITY_DIRECTORY_ORGANIZATION_CODE: XXXX-XXXX-XXXX-XXXX-XXXX-XXXX
        # Valide la syntaxe du fichier compose (et l'interpolation des variables)
        # --quiet : n'affiche rien, ne renvoie qu'un code d'erreur si c'est invalide
  installations:
    name: Installations (site central, box sur Rocky Linux 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # le jeton GitHub ne reste pas dans le dépôt cloné
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Scripts shell (shellcheck)
        run: >
          shellcheck deploy/box-systemd/*.sh deploy/box-systemd/bin/*.sh deploy/box-systemd/tests/*.sh
          deploy/site-central/*.sh deploy/livraison/*.sh

      - name: Site central (Compose et Caddy)
        working-directory: deploy/site-central
        run: |
          docker compose --env-file exemple.env -f compose.yml config --quiet
          for TLS in "" local_certs; do
            docker run --rm -e RELAIS_HOTE=relais.exemple.org -e ANNUAIRE_HOTE=annuaire.exemple.org \
              -e "RESEAU_ADMIN=192.168.1.0/24 10.0.0.5/32" -e TLS_INTERNE=$TLS \
              -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10 \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done

      - name: Unités systemd de la box
        run: sudo sh deploy/box-systemd/tests/verifier-unites.sh

      - name: Box et lanceur (sans console)
        working-directory: backend
        run: sh ./mvnw -B -ntp -DskipTests -Djacoco.skip=true -Dconsole.skip=true -pl app,release -am package

      - name: Installation de la box sur Rocky Linux 10
        run: |
          sh deploy/box-systemd/tests/preparer-essai.sh "$RUNNER_TEMP/essai"
          docker run --rm -v "$RUNNER_TEMP/essai:/essai:ro" rockylinux/rockylinux:10 sh /essai/installation-rocky.sh
