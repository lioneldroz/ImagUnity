imagunity:
  directory:
    # Clé publique de l'organisation (fichier .pub.json produit par « organisation-creer ») : toute entrée déposée
    # doit être signée par elle. Les box revérifient tout de leur côté.
    organization-key: ${IMAGUNITY_DIRECTORY_ORGANIZATION_KEY:./organisation.pub.json}
    # Son empreinte courte, vérifiée hors bande avec le responsable : sans elle, ou si la clé installée en a une
    # autre, le service refuse de démarrer.
    organization-code: ${IMAGUNITY_DIRECTORY_ORGANIZATION_CODE:}
    # Compte de dépôt du responsable (HTTP Basic). Sans mot de passe : un mot de passe aléatoire est généré et écrit
    # dans generated-password-file, lisible du seul compte du service (jamais dans les journaux).
    publisher-user: ${IMAGUNITY_DIRECTORY_PUBLISHER_USER:responsable}
    publisher-password: ${IMAGUNITY_DIRECTORY_PUBLISHER_PASSWORD:}
    generated-password-file: ${IMAGUNITY_DIRECTORY_GENERATED_PASSWORD_FILE:./mot-de-passe-depot.txt}
    # Preuve de fraîcheur (étape 2 de la fédération) : clé déléguée par le responsable (fraicheur-deleguer) et sa
    # délégation. Vides : l'annuaire ne publie pas de preuve de fraîcheur.
    freshness-key: ${IMAGUNITY_DIRECTORY_FRESHNESS_KEY:}
    freshness-delegation: ${IMAGUNITY_DIRECTORY_FRESHNESS_DELEGATION:}
    # Lecture réservée (étape 4 de la fédération) : listes lisibles des seules box actives, des partenaires reconnus
    # et des comptes. À activer une fois toutes les box et tous les relais à jour.
    restricted-read: ${IMAGUNITY_DIRECTORY_RESTRICTED_READ:false}
    # Compte de lecture (relais). Vide : pas de compte de lecture.
    reader-user: ${IMAGUNITY_DIRECTORY_READER_USER:lecteur}
    reader-password: ${IMAGUNITY_DIRECTORY_READER_PASSWORD:}
    # Lecture des annuaires des partenaires (entrées et preuves de fraîcheur).
    partner-sync-interval: ${IMAGUNITY_DIRECTORY_PARTNER_SYNC_INTERVAL:5m}

spring:
  application:
    name: imagunity-directory
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${IMAGUNITY_DIRECTORY_DB_URL:jdbc:postgresql://localhost:5432/annuaire}
    username: ${IMAGUNITY_DIRECTORY_DB_USER:annuaire}
    password: ${IMAGUNITY_DIRECTORY_DB_PASSWORD:}

server:
  port: ${IMAGUNITY_DIRECTORY_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
