imagunity:
  box:
    name: ${IMAGUNITY_BOX_NAME:box-dev}
  dicom:
    # Adresse d'écoute DICOM : celle de l'interface du réseau local (vide : toutes les interfaces, déconseillé).
    bind-address: ${IMAGUNITY_DICOM_BIND_ADDRESS:}
    port: ${IMAGUNITY_DICOM_PORT:11112}
    storage-dir: ${IMAGUNITY_DATA_DIR:./data}/incoming
    study-idle-timeout: 30s
    min-free-space: 1GB
    # Émetteurs locaux autorisés (PACS, stations). Liste vide : toute association est refusée.
    allowed-calling-aets: []
    # Destinations DICOM : envoyer à called-aet, c'est désigner le partenaire destination.
    # Exemple :
    # routes:
    #   - called-aet: IU_TO_B
    #     destination: box-b
    routes: []
    # Routage par champ DICOM : sur routing-aet, le partenaire est choisi par la première règle qui correspond
    # (motifs * et ?, ! pour la négation, casse ignorée) ; sans règle correspondante, l'instance est refusée.
    # Exemple :
    # routing-aet: IU_AUTO
    # rules:
    #   - name: scanner-urgences
    #     when: {Modality: CT, InstitutionName: "CHU*"}
    #     to: [box-b]
    #   - name: irm
    #     when: {Modality: MR}
    #     to: [box-b, box-c]
    routing-aet: ${IMAGUNITY_DICOM_ROUTING_AET:}
    rules: []
  # Réception DICOMweb STOW-RS (POST /dicomweb/<AET>/studies) : compte du PACS, distinct du compte opérateur.
  # Sans mot de passe, la réception STOW-RS est fermée.
  dicomweb:
    user: ${IMAGUNITY_DICOMWEB_USER:pacs}
    password: ${IMAGUNITY_DICOMWEB_PASSWORD:}
  orchestration:
    outbox-dir: ${IMAGUNITY_DATA_DIR:./data}/outbox
    pairing-timeout: 1h
    max-part-size: 900MB
    compression-level: 3
  restore:
    # PACS local qui reçoit les études restituées (C-STORE).
    pacs-host: ${IMAGUNITY_PACS_HOST:localhost}
    pacs-port: ${IMAGUNITY_PACS_PORT:4242}
    pacs-aet: ${IMAGUNITY_PACS_AET:ORTHANC}
    box-aet: ${IMAGUNITY_BOX_AET:IMAGUNITY}
    inbox-dir: ${IMAGUNITY_DATA_DIR:./data}/inbox
    max-inbound-file-size: 2GB
    max-unpacked-size: 4GB
  console:
    # Compte opérateur de la console et de l'API (HTTP Basic). Sans mot de passe, un mot de passe aléatoire
    # est généré à chaque démarrage et journalisé. Accepte un hachage préfixé, par exemple {bcrypt}$2a$...
    user: ${IMAGUNITY_CONSOLE_USER:operateur}
    password: ${IMAGUNITY_CONSOLE_PASSWORD:}
    # Un transfert annoncé sans accusé au-delà de ce délai est signalé dans la console.
    ack-overdue: 30m
  directory:
    # Annuaire signé de l'organisation (voir docs/annuaire-signe.md). Désactivé : tout partenaire appairé est accepté.
    enabled: ${IMAGUNITY_DIRECTORY_ENABLED:false}
    url: ${IMAGUNITY_DIRECTORY_URL:}
    organization-key: ${IMAGUNITY_DIRECTORY_ORGANIZATION_KEY:}
    # Empreinte courte du responsable, vérifiée hors bande puis recopiée ici : sinon la box refuse de démarrer.
    organization-code: ${IMAGUNITY_DIRECTORY_ORGANIZATION_CODE:}
    identity-file: ${IMAGUNITY_DATA_DIR:./data}/identite-box.json
    # Phrase de passe qui chiffre la clé de la box : de préférence dans un fichier (secret Docker), hors du volume
    # de données. Sans elle, la clé est en clair (avertissement au démarrage).
    identity-passphrase: ${IMAGUNITY_DIRECTORY_IDENTITY_PASSPHRASE:}
    identity-passphrase-file: ${IMAGUNITY_DIRECTORY_IDENTITY_PASSPHRASE_FILE:}
    # Clés de la box protégées par un secret scellé dans son TPM (TPM2TOOLS_TCTI, défaut /dev/tpmrm0), lié si voulu
    # à l’état de démarrage mesuré (par exemple sha256:0,7).
    identity-tpm: ${IMAGUNITY_DIRECTORY_IDENTITY_TPM:false}
    identity-tpm-pcrs: ${IMAGUNITY_DIRECTORY_IDENTITY_TPM_PCRS:}
    sync-interval: ${IMAGUNITY_DIRECTORY_SYNC_INTERVAL:5m}
    # Chiffrement applicatif des paquets pour la box destinataire (false : migration d’un parc seulement).
    encryption-required: ${IMAGUNITY_DIRECTORY_ENCRYPTION_REQUIRED:true}
  # Configuration centralisée (docs/configuration-centralisee.md) : règles de priorité et de routage signées par le
  # responsable, lues avec l'annuaire et appliquées sans redémarrage. false : configuration locale seulement.
  central-configuration:
    enabled: ${IMAGUNITY_CENTRAL_CONFIGURATION:true}
    file: ${IMAGUNITY_DATA_DIR:./data}/configuration-centrale.json
  priority:
    # Priorité des séries (1 = la plus haute, 9 = la plus basse) : les prioritaires partent et sont restituées les
    # premières. Règles dans un fichier JSON rechargé à chaud (IMAGUNITY_PRIORITY_FILE), ou ici / en variables
    # d'environnement (IMAGUNITY_PRIORITY_RULES_0_NAME, _PRIORITY, _AND_MODALITY, _OR_IMAGETYPE…).
    default-priority: ${IMAGUNITY_PRIORITY_DEFAULT:5}
    file: ${IMAGUNITY_PRIORITY_FILE:}
  transport:
    # Transport IU-T : relais de l'organisation (exige l'annuaire). Sans relais, transport désactivé : la box
    # démarre et reçoit les examens, mais leurs transferts passent en échec.
    iu:
      relay: ${IMAGUNITY_IU_RELAY:}
      # plusieurs relais indépendants, séparés par des virgules (le premier est le principal) ; remplace relay
      relays: ${IMAGUNITY_IU_RELAYS:}
      # copies des morceaux de chaque envoi : 0 = une par relais
      replicas: ${IMAGUNITY_IU_REPLICAS:0}
      state-dir: ${IMAGUNITY_DATA_DIR:./data}/iu
      ttl: ${IMAGUNITY_IU_TTL:72h}
      # Annonce anticipée : le destinataire télécharge pendant le téléversement (false : après).
      early: ${IMAGUNITY_IU_EARLY:true}
      # Taille des morceaux : auto (adaptée au débit mesuré), ou 256KB, 1MB, 4MB, 8MB.
      chunk-size: ${IMAGUNITY_IU_CHUNK_SIZE:auto}

spring:
  application:
    name: imagunity-box
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:${IMAGUNITY_DATA_DIR:./data}/imagunity
    username: sa
    password: ""

server:
  port: ${IMAGUNITY_HTTP_PORT:8080}
  # Adresse d'écoute de la console et de l'API : réglée par SERVER_ADDRESS (interface du réseau local).
  # Sans elle, la console écoute sur toutes les interfaces et un avertissement est journalisé.

management:
  endpoints:
    web:
      exposure:
        include: health,info
