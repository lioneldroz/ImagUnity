imagunity:
  box:
    name: ${IMAGUNITY_BOX_NAME:box-dev}
  dicom:
    # Adresse d'écoute DICOM : celle de l'interface du réseau local (vide : toutes les interfaces, déconseillé).
    bind-address: ${IMAGUNITY_DICOM_BIND_ADDRESS:}
    port: ${IMAGUNITY_DICOM_PORT:11112}
    storage-dir: ${IMAGUNITY_DATA_DIR:./data}/incoming
    study-idle-timeout: 30s
    min-free-space: 1GB
    # Émetteurs locaux autorisés (PACS, stations). Liste vide : toute association est refusée.
    allowed-calling-aets: []
    # Destinations DICOM : envoyer à called-aet, c'est désigner le partenaire destination.
    # Exemple :
    # routes:
    #   - called-aet: IU_TO_B
    #     destination: box-b
    routes: []
  orchestration:
    outbox-dir: ${IMAGUNITY_DATA_DIR:./data}/outbox
    pairing-timeout: 1h
    max-part-size: 900MB
    compression-level: 3
  restore:
    # PACS local qui reçoit les études restituées (C-STORE).
    pacs-host: ${IMAGUNITY_PACS_HOST:localhost}
    pacs-port: ${IMAGUNITY_PACS_PORT:4242}
    pacs-aet: ${IMAGUNITY_PACS_AET:ORTHANC}
    box-aet: ${IMAGUNITY_BOX_AET:IMAGUNITY}
    inbox-dir: ${IMAGUNITY_DATA_DIR:./data}/inbox
    max-inbound-file-size: 2GB
    max-unpacked-size: 4GB
  console:
    # Compte opérateur de la console et de l'API (HTTP Basic). Sans mot de passe, un mot de passe aléatoire
    # est généré à chaque démarrage et journalisé. Accepte un hachage préfixé, par exemple {bcrypt}$2a$...
    user: ${IMAGUNITY_CONSOLE_USER:operateur}
    password: ${IMAGUNITY_CONSOLE_PASSWORD:}
    # Un transfert annoncé sans accusé au-delà de ce délai est signalé dans la console.
    ack-overdue: 30m
  transport:
    simplex:
      # false : transport désactivé (développement sans simplex-chat) ; les transferts passent en échec.
      enabled: ${IMAGUNITY_SIMPLEX_ENABLED:true}
      url: ${IMAGUNITY_SIMPLEX_URL:ws://localhost:5225}
      startup-timeout: 2m
      command-timeout: 60s

spring:
  application:
    name: imagunity-box
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:${IMAGUNITY_DATA_DIR:./data}/imagunity
    username: sa
    password: ""

server:
  port: ${IMAGUNITY_HTTP_PORT:8080}
  # Adresse d'écoute de la console et de l'API : réglée par SERVER_ADDRESS (interface du réseau local).
  # Sans elle, la console écoute sur toutes les interfaces et un avertissement est journalisé.

management:
  endpoints:
    web:
      exposure:
        include: health,info
