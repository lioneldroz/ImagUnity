<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Comment une box s'enrôle</title>
<style>html,body{margin:0;background:#F6F7F4;overflow:hidden}</style></head>
<body><script src="moteur.js"></script><script>
"use strict";
// Film 3 : comment une box s'enrôle (code d'enrôlement, demande signée, signature hors ligne, publication).
const RESP = [270, 470], INST = [1450, 470], BOX = [1680, 700], ANN = [960, 260], REL = [960, 720];

function decor(t, o, extras = {}) {
  return [
    site(80, 140, 380, 760, "Poste du responsable", { opacity: o, stroke: C.signe }),
    site(1290, 140, 560, 760, "Nouvel établissement", { opacity: o }),
    personne(RESP[0], RESP[1] - 150, "Responsable", { couleur: C.signe, opacity: o }),
    cle(RESP[0], RESP[1] + 40, { opacity: o, echelle: 1.3 }),
    text(RESP[0], RESP[1] + 100, "clé de l'organisation\n(hors ligne)", { size: 20, fill: C.signe, opacity: o }),
    extras.installateur === false ? null : personne(INST[0], INST[1] - 150, "Installateur", { opacity: o }),
    extras.box ? box(BOX[0], BOX[1], "Box C", { opacity: o * extras.box, voyant: extras.active ? C.chiffre : C.signe }) : null,
    extras.annuaire ? annuaire(ANN[0], ANN[1], "Annuaire", { opacity: o * extras.annuaire }) : null,
    extras.relais ? relais(REL[0], REL[1], "Relais", { opacity: o * extras.relais }) : null,
  ];
}
const titre = (s, t, de, a) => text(960, 80, s, { size: 40, weight: 700, opacity: vis(t, de, a) });

film({
  titre: "Comment une box s'enrôle",
  duree: 112,
  couverture: 64,
  sousTitres: [
    [2, 8, "Comment une nouvelle box rejoint l'organisation :\nle code d'enrôlement, la demande signée, la signature du responsable."],
    [10, 17, "Le responsable tire un code d'enrôlement pour la box à venir,\nen fixant son nom et ses groupes."],
    [17, 24, "Il le transmet hors bande à l'installateur : par téléphone, par courrier, en personne.\nUsage unique, valable 30 jours."],
    [26, 32, "L'installateur recopie le code dans la configuration de la box, et la démarre."],
    [32, 39, "Au premier démarrage, la box crée son identité : une clé de signature et une clé de chiffrement,\nprotégées par le TPM de la machine."],
    [41, 48, "La box envoie sa demande d'enrôlement à l'annuaire : signée par elle,\navec la preuve qu'elle connaît le code."],
    [48, 56, "L'annuaire garde la demande, mais ne connaît pas les codes :\nil ne peut ni les lire, ni fabriquer une preuve."],
    [58, 66, "Sur son poste, hors ligne, le responsable retrouve la demande et vérifie la preuve du code.\nSans code : il compare l'empreinte de la box au téléphone avec l'installateur."],
    [66, 74, "Il signe l'entrée de la box avec la clé de l'organisation, avec le nom et les groupes du code,\npuis la publie dans l'annuaire."],
    [76, 83, "À sa lecture suivante de l'annuaire, la box se voit active."],
    [83, 91, "Elle crée sa boîte aux lettres sur le relais. Les autres box la voient à leur tour,\net leurs exploitants peuvent l'appairer."],
    [93, 103, "La clé de l'organisation n'a jamais quitté le poste du responsable :\nl'annuaire ne fait que conserver et servir des documents signés."],
  ],
  plans: [
    { de: 0, a: 9, dessin: (t) => [
      text(960, 470, "Comment une box s'enrôle", { size: 84, weight: 800, fill: C.box, opacity: vis(t, 0, 8.6) }),
      text(960, 550, "du code d'enrôlement à la box active", { size: 40, fill: C.discret, opacity: vis(t, 0.6, 8.6) }),
    ] },
    { de: 9, a: 25, dessin: (t) => {
      const p = prog(t, 18, 22.5);
      return [titre("1. Un code pour la box à venir", t, 9, 25), ...decor(t, vis(t, 9, Infinity)),
        bulle(RESP[0], RESP[1] + 220, "code-creer\n« CHU Exemple — Sud »\ngroupes : imagerie", { size: 22, mono: true, opacity: vis(t, 10.5, 25), couleur: C.signe }),
        document_(...along([[RESP[0] + 120, RESP[1] - 40], [960, 380], [INST[0] - 90, INST[1] - 150]], p), "code", { opacity: vis(t, 13, 25), echelle: 1.2 }),
        text(960, 280, "hors bande : téléphone, courrier", { size: 26, fill: C.discret, opacity: vis(t, 18, 25) }),
        fleche([[RESP[0] + 140, RESP[1] - 160], [INST[0] - 120, INST[1] - 160]], { pointille: true, opacity: vis(t, 18, 25) * 0.6 }),
      ];
    } },
    { de: 25, a: 40, dessin: (t) => [titre("2. La box démarre et crée son identité", t, 25, 40), ...decor(t, 1, { box: vis(t, 27, Infinity) }),
      bulle(1570, 540, "box.env\nIMAGUNITY_DIRECTORY_ENROLLMENT_CODE=…", { size: 20, mono: true, opacity: vis(t, 26, 40), couleur: C.box }),
      cle(BOX[0] - 70, BOX[1] + 115, { couleur: C.signe, opacity: vis(t, 33, 40) }),
      cle(BOX[0] + 10, BOX[1] + 115, { couleur: C.chiffre, opacity: vis(t, 34, 40) }),
      bulle(BOX[0] + 30, BOX[1] + 185, "TPM", { size: 22, weight: 700, opacity: vis(t, 35, 40), couleur: C.trait }),
    ] },
    { de: 40, a: 57, dessin: (t) => {
      const p = prog(t, 42, 46.5);
      return [titre("3. La demande signée part vers l'annuaire", t, 40, 57), ...decor(t, 1, { box: 1, annuaire: vis(t, 40, Infinity) }),
        document_(...along([[BOX[0] - 120, BOX[1] - 40], [1200, 450], [ANN[0] + 100, ANN[1]]], p), "demande", { label: p > 0.9 ? "" : "demande + preuve" }),
        bulle(ANN[0], ANN[1] + 190, "demande en attente\n(le code ? inconnu ici)", { size: 24, opacity: vis(t, 48.5, 57), couleur: C.annuaire }),
        croix(ANN[0] + 160, ANN[1] + 160, { opacity: vis(t, 50, 57), echelle: 0.7 }),
      ];
    } },
    { de: 57, a: 75, dessin: (t) => {
      const p = prog(t, 58, 61);
      const q = prog(t, 69, 72.5);
      return [titre("4. Le responsable vérifie et signe, hors ligne", t, 57, 75), ...decor(t, 1, { box: 1, annuaire: 1 }),
        document_(...along([[ANN[0] - 100, ANN[1]], [RESP[0] + 150, RESP[1] - 40]], p), "demande", { opacity: vis(t, 57, 66.5) }),
        bulle(RESP[0] + 30, RESP[1] + 230, "preuve du code ✓\nnom et groupes du code", { size: 22, opacity: vis(t, 62, 75), couleur: C.chiffre, texte: C.chiffre }),
        sceau(RESP[0] + 150, RESP[1] - 40, { opacity: vis(t, 66.5, 69.5), echelle: 1.3 }),
        document_(...along([[RESP[0] + 150, RESP[1] - 40], [ANN[0] - 100, ANN[1]]], q), "entree", { opacity: vis(t, 66.5, 75), label: "entrée signée" }),
      ];
    } },
    { de: 75, a: 92, dessin: (t) => {
      const p = prog(t, 77, 80.5);
      const q = prog(t, 84, 87);
      return [titre("5. La box se voit active et ouvre sa boîte aux lettres", t, 75, 92),
        ...decor(t, 1, { box: 1, annuaire: 1, active: t > 81, relais: vis(t, 83, Infinity) }),
        document_(...along([[ANN[0] + 100, ANN[1]], [1200, 480], [BOX[0] - 120, BOX[1] - 50]], p), "entree", { echelle: 0.7, opacity: vis(t, 76, 82) }),
        text(BOX[0], BOX[1] - 90, "active ✓", { size: 26, fill: C.chiffre, weight: 700, opacity: vis(t, 81, 92) }),
        el("rect", { x: REL[0] + 60, y: REL[1] - 30, width: 120, height: 60, rx: 10, fill: "#fff", stroke: C.relais, "stroke-width": 3, opacity: q }),
        text(REL[0] + 120, REL[1] + 60, "boîte de C", { size: 20, fill: C.relais, opacity: q }),
        fleche([[BOX[0] - 120, BOX[1] + 10], [REL[0] + 190, REL[1]]], { opacity: vis(t, 84, 92), couleur: C.relais }),
      ];
    } },
    { de: 92, a: 112, dessin: (t) => {
      const etapes = [["code tiré", C.signe], ["hors bande", C.trait], ["identité de la box", C.box], ["demande + preuve", C.box],
        ["vérifiée, signée hors ligne", C.signe], ["publiée", C.annuaire], ["box active", C.chiffre]];
      return [text(960, 300, "En résumé", { size: 56, weight: 800, fill: C.box, opacity: vis(t, 92, 112) }),
        ...etapes.map(([s, c], i) => bulle(960, 400 + i * 70, s, { size: 28, largeur: 520, couleur: c, opacity: vis(t, 93 + i * 0.6, 112) }))];
    } },
  ],
});
</script></body></html>
